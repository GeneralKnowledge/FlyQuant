# Phase 5: isolate state precision from weight quantisation.
# Uses web escape subgraph (no Codex login).
runs:
  - name: ref_state_ablation
    method: reference
    experiment: escape_subgraph
    connectome_source: web
    subgraph: escape
    seed: 0
    duration_ms: 60
    rate_hz: 150
    min_ram_gb: 0
    execution_dtype: fp32

  - name: state_fp16_escape_subgraph
    method: state_fp16
    experiment: escape_subgraph
    connectome_source: web
    subgraph: escape
    seed: 0
    duration_ms: 60
    rate_hz: 150
    min_ram_gb: 0

  - name: weight_fp16_escape_subgraph
    method: fp16
    experiment: escape_subgraph
    connectome_source: web
    subgraph: escape
    seed: 0
    duration_ms: 60
    rate_hz: 150
    min_ram_gb: 0
    native_fp16_execution: true
