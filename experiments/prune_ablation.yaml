# Phase 6: fixed a-priori prune levels — NOT tuned on evaluation outcomes.
# keep_fraction levels and synapse-count thresholds chosen before measuring.
runs:
  - name: prune_ref
    method: reference
    experiment: escape_subgraph
    connectome_source: web
    subgraph: escape
    seed: 0
    duration_ms: 60
    rate_hz: 150
    min_ram_gb: 0

