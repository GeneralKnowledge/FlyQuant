# Phase 6: isolated vs combined prune/quant/lossless ablations.
# Same seed/stimulus/reference for all rows.
runs:
  - name: pipe_ref
    method: reference
    experiment: escape_subgraph
    connectome_source: web
    subgraph: escape
    seed: 0
    duration_ms: 60
    rate_hz: 150
    min_ram_gb: 0

  - name: pipe_prune_only
    method: prune
    experiment: escape_subgraph
    connectome_source: web
    subgraph: escape
    seed: 0
    duration_ms: 60
    rate_hz: 150
    min_ram_gb: 0
    prune_method: keep_fraction
    prune_level: 0.9

  - name: pipe_quant_only
    method: int8
    experiment: escape_subgraph
    connectome_source: web
    subgraph: escape
    seed: 0
    duration_ms: 60
    rate_hz: 150
    min_ram_gb: 0

  - name: pipe_prune_then_quant
    method: pipeline
    experiment: escape_subgraph
    connectome_source: web
    subgraph: escape
    seed: 0
    duration_ms: 60
    rate_hz: 150
    min_ram_gb: 0
    steps:
      - { op: prune, prune_method: keep_fraction, prune_level: 0.9 }
      - { op: quantise, precision: int8 }

  - name: pipe_quant_then_prune
    method: pipeline
    experiment: escape_subgraph
    connectome_source: web
    subgraph: escape
    seed: 0
    duration_ms: 60
    rate_hz: 150
    min_ram_gb: 0
    steps:
      - { op: quantise, precision: int8 }
      - { op: prune, prune_method: keep_fraction, prune_level: 0.9 }

  - name: pipe_lossless_only
    method: lossless_graph
    experiment: escape_subgraph
    connectome_source: web
    subgraph: escape
    seed: 0
    duration_ms: 60
    rate_hz: 150
    min_ram_gb: 0
    gzip: true
